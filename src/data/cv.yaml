# Paragraphs. [text](https://...) becomes a link.
about:
  - ca: Vaig estudiar Enginyeria de Telecomunicacions i vaig completar un Màster en Intel·ligència Artificial a la Universitat Rovira i Virgili.
    en: I studied Telecommunications Engineering and completed a Master's in Artificial Intelligence at Universitat Rovira i Virgili.
  - ca: També em dedico a la docència. Soc professor associat a la URV des del 2021, faig cursos de Python a l'Acadèmia Gaudí i preparo materials oberts, com els de [Física de 2n de Batxillerat](https://nil-munte.github.io/fisica-2n-bat/).
    en: I also teach. I've been an associate professor at URV since 2021, I run Python courses at Acadèmia Gaudí and I prepare open materials, such as my [upper secondary Physics](https://nil-munte.github.io/fisica-2n-bat/) site.
  - ca: En el meu temps lliure, m'agrada molt fer senderisme i anar a la muntanya. Vaig ser monitor de l'esplai de Riudoms, el meu poble, i m'agrada cuinar; les receptes que he fet són a [Cuina amb mi](https://nil-munte.github.io/cuina-amb-mi/).
    en: In my free time, I really like hiking and going to the mountains. I was a youth leader at the esplai (a Catalan youth leisure club) in Riudoms, my home town, and I enjoy cooking; the recipes I've made are on [Cuina amb mi](https://nil-munte.github.io/cuina-amb-mi/) (in Catalan).
# Project ids shown as cards at the end of About.
about_projects: [cuina-amb-mi, fisica-2n-bat]
