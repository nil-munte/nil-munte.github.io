# Font única del CV i del portfoli.
#
# Tot el que surt a la web (Inici, Carrera, Projectes, Sobre mi) i als PDF del CV
# (cv/cv.typ) es llegeix d'aquest fitxer. Cada text que es mostra té versió
# catalana (ca) i anglesa (en). En compilar, src/data/cv.ts ho valida: si falta
# un camp o una traducció, la compilació falla i diu on.
#
# Dates: "AAAA-MM" entre cometes. end: null vol dir «actualitat».
# cv: false amaga una entrada del PDF però la deixa a la web.

person:
  name: Nil Munté Guerrero
  initials: NM
  location: Barcelona
  email: nilmunte@gmail.com
  phone: "+34 628 119 680"
  # El telèfon no es publica (spam). Posa-ho a true per mostrar-lo a la web i al PDF.
  show_phone: false
  website: https://nil-munte.github.io
  links:
    - id: linkedin
      label: LinkedIn
      handle: in/nilmunte
      url: https://www.linkedin.com/in/nilmunte
    - id: github
      label: GitHub
      handle: nil-munte
      url: https://github.com/nil-munte
  roles:
    ca: Enginyer R+D · Professor associat · Cap de projectes
    en: R&D Engineer · Associate Professor · Project Manager
  degrees:
    ca: Enginyer de Telecomunicacions · Màster en Intel·ligència Artificial
    en: Telecommunications Engineer · MSc in Artificial Intelligence
  headline:
    ca: Porto la IA i els sensors del laboratori a projectes reals de mobilitat.
    en: I take AI and sensing out of the lab and into real mobility projects.
  summary:
    ca: >-
      He passat del radar d'ones mil·limètriques a la validació de sistemes ADAS,
      i de dirigir projectes europeus a fer classe a la universitat. M'agrada el
      punt on la tècnica es troba amb les persones: definir què s'ha de mesurar,
      construir l'eina que ho mesura i explicar-ho perquè tothom ho entengui.
      M'apassiona la mobilitat elèctrica i sempre busco projectes amb impacte a prop de casa.
    en: >-
      I've gone from millimetre-wave radar to validating ADAS systems, and from
      managing European projects to teaching at university. I like the point where
      engineering meets people: deciding what to measure, building the tool that
      measures it, and explaining the results so everyone understands them.
      I'm passionate about electric mobility and always looking for projects with local impact.
  about:
    ca:
      - >-
        Vaig estudiar Enginyeria de Telecomunicacions a la Universitat Rovira i Virgili,
        on vaig ser delegat de curs tres anys seguits, i després el Màster en Seguretat
        Informàtica i Intel·ligència Artificial. La curiositat ve de lluny: als 17 anys el
        treball de recerca «Nassos electrònics» va guanyar un Premi de Recerca Jove.
      - >-
        M'agrada entendre les coses fins al fons i, després, explicar-les. Per això
        combino l'enginyeria amb la docència: a la URV, a l'Acadèmia Gaudí i amb materials
        oberts com els de Física de 2n de Batxillerat.
      - >-
        Fora de la feina sóc de muntanya: m'agrada fer cims i caminar per la serralada.
        També he estat monitor d'escoltes.
    en:
      - >-
        I studied Telecommunications Engineering at Universitat Rovira i Virgili, where I
        was class representative three years in a row, followed by an MSc in Computer
        Security and Artificial Intelligence. The curiosity started early: at 17, my
        research project "Electronic Noses" won a Youth Research Award.
      - >-
        I like to understand things thoroughly and then explain them. That's why I combine
        engineering with teaching: at URV, at Acadèmia Gaudí and through open materials
        such as my Physics revision site for upper secondary students.
      - >-
        Outside work I'm a mountain person: I love hiking and reaching summits.
        I've also been a scout leader.
  # Dades per a les xifres de la portada (la resta es compten soles).
  eu_projects: 2

