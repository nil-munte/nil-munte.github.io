    ca: Amb experiència pràctica en sistemes encastats, desenvolupament de programari, aplicacions basades en dades i educació, aporto tant profunditat tècnica com habilitats de gestió de projectes per oferir solucions significatives. Sempre busco contribuir a iniciatives locals, i estic especialment apassionat per la mobilitat elèctrica.
