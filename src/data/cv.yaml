# category: research | web | teaching show on Projects; personal only in About.
# featured: true also shows the project on the home page (3 at most).
# image: file in src/assets/projects/.
projects:
  # Recerca i enginyeria
  - id: radar
    category: research
    featured: true
    image: radar.jpg
    title:
      ca: Detecció d'ocupació i gestos amb radar
      en: Occupancy and gesture detection with radar
    description:
      ca: Radars FMCW de 60 i 77 GHz per saber qui hi ha dins d'un cotxe i reconèixer gestos de la mà; dos articles IEEE i un premi del COITT.
      en: 60 and 77 GHz FMCW radars that detect who is inside a car and recognise hand gestures; two IEEE papers and a COITT award.
    code: https://github.com/nil-munte/Radar_Texas_AWR1642
    links:
      - label: { ca: Article IEEE (PDF), en: IEEE paper (PDF) }
        url: /info/IEEESensors_77GHz.pdf
      - label: { ca: Radar IWR1443, en: IWR1443 radar }
        url: https://github.com/nil-munte/Radar_Texas_IWR1443
      - label: { ca: Radar XM132, en: XM132 radar }
        url: https://github.com/nil-munte/Radar_Acconeer_XM132
  - id: grid
    category: research
    title:
      ca: Fluctuacions de freqüència de la xarxa elèctrica
      en: Power-grid frequency fluctuations
    description:
      ca: Model amb equacions diferencials de la sincronització de la xarxa elèctrica de Gran Canària, amb dades reals.
      en: ODE-based model of power-grid synchronisation on Gran Canaria, using real data.
    code: https://github.com/nil-munte/Sincronization-Gran-Canaria-Julia-Fortran
  - id: neural
    category: research
    title:
      ca: Implementació d'una xarxa neuronal
      en: Neural network implementation
    description:
      ca: Una xarxa neuronal senzilla implementada des de zero en Java.
      en: A simple neural network implemented from scratch in Java.
    code: https://github.com/nil-munte/Neural-Net
  # Aplicacions web
  - id: calcul-cost-trajecte
    category: web
    featured: true
    image: calcul-cost-trajecte.jpg
    title:
      ca: Cost d'un viatge en cotxe elèctric
      en: Electric car trip cost
    description:
      ca: Calcula el cost real d'un viatge combinant la càrrega a casa i fora, amb el preu de la llum tret de la factura.
      en: Works out the real cost of a trip by combining home and public charging, with the electricity price taken from your bill.
    demo: https://nil-munte.github.io/calcul-cost-trajecte/
    code: https://github.com/nil-munte/calcul-cost-trajecte
  - id: model-region
    category: web
    image: model-region.jpg
    title:
      ca: Disponibilitat de models d'IA per regió
      en: AI model availability by region
    description:
      ca: Mostra en quins proveïdors de núvol i regions hi ha cada model d'IA, a partir de la seva documentació.
      en: Shows which cloud providers and regions offer each AI model, based on their documentation.
    demo: https://nil-munte.github.io/model-region/
    code: https://github.com/nil-munte/model-region
  - id: riudoms-3d
    category: web
    image: riudoms-3d.jpg
    title:
      ca: Riudoms 3D
      en: Riudoms 3D
    description:
      ca: Recreació 3D navegable del poble amb dades obertes reals (Cadastre, LiDAR de l'ICGC, OpenStreetMap), feta dirigint una IA (Claude Code).
      en: A walkable 3D model of the village built from real open data (land registry, ICGC LiDAR, OpenStreetMap), made by directing an AI (Claude Code).
    demo: https://nil-munte.github.io/riudoms-3d/
    code: https://github.com/nil-munte/riudoms-3d
