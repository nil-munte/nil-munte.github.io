              ca: Occupancy Detection Project Video
              en: Occupancy Detection Project Video
      - title:
          ca: Sistema de Detecció de Gestos de Ma
          en: Hand-Gesture Detection System
        paragraphs:
          - ca: Dissenyat i implementat un sistema de reconeixement de gestos de mà utilitzant Matlab i Xarxes Neuronals Convolucionals (CNN). Els resultats d'aquest projecte es van publicar sota el títol "In-Vehicle Monitoring Based on a Low-Cost mm-Wave Radar at 60 GHz" a la conferència IEEE IMOC 2023.
            en: Designed and implemented a hand-gesture recognition system using Matlab and Convolutional Neural Networks (CNNs). The results of this project were published under the title "In-Vehicle Monitoring Based on a Low-Cost mm-Wave Radar at 60 GHz" at the IEEE IMOC 2023 conference.
