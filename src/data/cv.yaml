  - id: nephos
    title:
      ca: Enginyer R+D
      en: R&D Engineer
    org:
      ca: NEPHOS Lab · Universitat Rovira i Virgili (URV)
      en: NEPHOS Lab · Universitat Rovira i Virgili (URV)
    intro:
      ca: "Durant el meu temps al NEPHOS Lab, em vaig centrar en analitzar sistemes de radar comercials i desenvolupar aplicacions del món real. El meu treball es va centrar en dos projectes automobilístics principals treballant amb un Radar de Texas Instruments:"
      en: "During my time at the NEPHOS Lab, I focused on analyzing commercial radar systems and developing real-world applications. My work centered on two main automotive projects working with a Texas Instruments Radar:"
    sections:
      - title:
          ca: Sistema de Detecció d'Ocupació
          en: Occupancy Detection System
        paragraphs:
          - ca: Vaig desenvolupar un sistema de detecció d'ocupació basat en radar per a l'interior de vehicles, aprofitant la tecnologia de radar de Texas Instruments.
            en: I developed a radar-based occupancy detection system for the interior of vehicles, leveraging Texas Instruments radar technology.
          - ca: Aquest projecte va formar la tesi del meu Final de Grau en Telecomunicacions i va ser reconegut amb el Premi "Futur de les Telecomunicacions" pel Col·legi Oficial d'Enginyers Tècnics de Telecomunicació (COITT) en la categoria d'Enginyeria de Sistemes de Telecomunicació.
            en: This project formed the thesis of my Final Telecommunications degree and was recognized with the "Future of Telecommunications" Award by the Official College of Telecommunication Engineers (COITT) in the category of Telecommunications Systems Engineering.
          - ca: Els resultats també es van publicar a l'IEEE Sensors Journal com l'article "Vehicle Occupancy Detector Based on FMCW mm-Wave Radar at 77 GHz"
            en: The results were also published in the IEEE Sensors Journal as the paper "Vehicle Occupancy Detector Based on FMCW mm-Wave Radar at 77 GHz"
        links:
          - label:
              ca: Article (PDF)
