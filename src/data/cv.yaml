  presentation:
    ca: Amb experiència pràctica en sistemes encastats, desenvolupament de programari, aplicacions basades en dades i educació, aporto tant profunditat tècnica com habilitats de gestió de projectes per oferir solucions significatives. Sempre busco contribuir a iniciatives locals, i estic especialment apassionat per la mobilitat elèctrica.
    en: With hands-on experience in embedded systems, software development, data-driven applications, and education, I bring both technical depth and project management skills to deliver meaningful solutions. I'm always looking to contribute to local initiatives, and I'm especially passionate about electric mobility.
career:
  - id: idiada
    title:
      ca: Enginyer de Programari · Director de Projectes
      en: Software Engineer · Project Manager
    org:
      ca: Applus+ IDIADA
      en: Applus+ IDIADA
    intro:
      ca: Durant aquest període, he liderat i contribuït a diversos projectes de Sistemes Avançats d'Assistència a la Conducció (ADAS) i Mobilitat Autònoma, treballant en avaluació de sistemes, visió per computador, gestió de projectes i desenvolupament d'eines.
      en: During this period, I led and contributed to several ADAS and Autonomous Mobility projects, working across system evaluation, computer vision, project management, and tool development.
    sections:
      - title:
          ca: Avaluació del Sistema de Percepció d'un Client
          en: Evaluation of a Client's Perception System
        paragraphs:
          - ca: Vaig desenvolupar i coordinar un programa complet de proves ADAS EuroNCAP, Regulació UN152 i ASEAN NCAP per a un sistema de càmera basat en IA, contribuint des de les primeres interaccions amb el client—definicions de KPIs, planificació d'estratègies de validació i alineació d'expectatives—fins a la implementació i lliurament. Com a part de l'equip de programari, vaig ajudar a configurar l'entorn de proves, permetent la captura de dades de sensors i el disparador automatitzat de proves utilitzant tecnologies com CAN, C++, Python i Linux.
            en: I developed and coordinated a complete ADAS EuroNCAP, Regulation UN152 and ASEAN NCAP testing program for an AI-based camera system, contributing from the earliest client interactions—defining KPIs, planning validation strategies, and aligning expectations—through to implementation and delivery. As part of the software team, I helped configure the test environment, enabling sensor data capture and automated test triggering using technologies such as CAN, C++, Python, and Linux.
          - ca: Per millorar la comunicació amb el client, vaig dissenyar i construir una eina de reporting que visualitzava resultats de proves i analítiques utilitzant React, HTML/CSS i Python—millorant significativament com es presentaven els resultats i augmentant l'impacte del projecte.
            en: To improve communication with the customer, I designed and built a reporting tool that visualized test results and analytics using React, HTML/CSS, and Python—significantly enhancing how insights were presented and increasing the impact of the project.
        media:
          - image: idiada-cavkit.jpg
            alt:
              ca: IDIADA's CAVkit
              en: IDIADA's CAVkit
      - title:
          ca: Projectes Europeus
          en: European Projects
        paragraphs:
          - ca: A més del meu treball tècnic, vaig exercir com a Director de Projectes per a dues iniciatives europees en l'àmbit de la mobilitat autònoma, AITHENA i AIGGREGATE. Dins del projecte AITHENA, vaig ser responsable de liderar un Paquet de Treball, coordinate múltiples socis a Europa i impulsant el consorci cap a la finalització exitosa de fites clau.
            en: Beyond my technical work, I served as Project Manager for two European initiatives in the autonomous mobility domain, AITHENA and AIGGREGATE. Within the AITHENA project, I was responsible for leading a Work Package, coordinating multiple partners across Europe and driving the consortium toward the successful completion of key milestones.
        links:
          - label:
              ca: Resum AITHENA WP4
              en: AITHENA WP4 summary
            url: https://aithena.eu/advancing-tools-and-testing-facilities-in-the-aithena-project-a-look-into-wp4/
        media:
          - image: aithena.jpg
            alt:
              ca: Aithena
              en: Aithena
          - image: aiggregate.jpg
            alt:
              ca: Aiggregate
              en: Aiggregate
  - id: urv
    title:
      ca: Professor Associat
      en: Associate Professor
    org:
      ca: Universitat Rovira i Virgili (URV)
      en: Universitat Rovira i Virgili (URV)
    intro:
      ca: "He estat impartint diverses assignatures pràctiques als graus d'Enginyeria de Telecomunicacions i d'Enginyeria Biomèdica, així com al seu programa de doble grau a la URV. El meu portafoli docent inclou:"
      en: "I have been teaching various practical subjects in the Telecommunications and Biomedical Engineering degrees, as well as their double-degree program at URV. My teaching portfolio includes:"
    list:
      - ca: "**Electrònica Digital:** Els estudiants van treballar amb plaques Xilinx FPGA, programant lògica en VHDL, i van desenvolupar un projecte de rellotge multifunció."
        en: "**Digital Electronics:** Students worked with Xilinx FPGA boards, programming logic in VHDL, and developed a multi-functional clock project."
      - ca: "**Tecnologies per a Xarxes de Sensors, IoT i Ciutats Intel·ligents:** Els exercicis pràctics incloïen aplicacions Arduino UNO amb WiFi/Zigbee, pujant dades de sensors a ThinkSpeak, i utilitzant mòduls Silicon Labs EFR32 programats en C (IDE Simplicity Studio) amb connectivitat Zigbee."
        en: "**Technologies for Sensor Networks, IoT, and Smart Cities:** Practical exercises included Arduino UNO applications with WiFi/Zigbee, uploading sensor data to ThinkSpeak, and using Silicon Labs EFR32 modules programmed in C (Simplicity Studio IDE) with Zigbee connectivity."
      - ca: "**Comunicacions Digitals:** Els estudiants van aprendre tècniques de modulació digital (M-PSK, M-QAM, etc.) i mètriques de càlcul d'errors, simulant-los en Matlab."
        en: "**Digital Communications:** Students learned digital modulation techniques (M-PSK, M-QAM, etc.) and error calculation metrics, simulating them in Matlab."
      - ca: "**Fonaments de Comunicacions:** Cobreix conceptes de comunicació analògica i digital (FFT, AM, FM, etc.) amb exercicis pràctics."
        en: "**Communications Fundamentals:** Covers analog and digital communication concepts (FFT, AM, FM, etc.) with practical exercises."
    links:
      - label:
          ca: Veure Cursos a la URV
          en: View Courses at URV
        url: https://www.urv.cat/html/grupsrecerca/investigadors/docencia-I79429.php
    media:
      - image: associate-professor.jpg
        alt:
          ca: Associate professor
          en: Associate professor
  - id: gaudi
    title:
      ca: Formador de Programació
      en: Programming Trainer
    org:
      ca: Acadèmia Gaudí
      en: Acadèmia Gaudí
    intro:
      ca: "He estat desenvolupant i impartint diversos cursos de programació, principalment enfocats en Python. El meu portafoli docent inclou:"
      en: "I have been developing and teaching various programming courses, primarily focused on Python. My teaching portfolio includes:"
    list:
      - ca: "**Introducció a Python:** Un curs de 6 hores que cobreix els fonaments de la programació en Python, incloent tipus de dades i operadors, estructures de dades, control de flux, funcions, mòduls i llibreries, gestió d'arxius, gestió d'errors i execució d'scripts."
        en: "**Introduction to Python:** A 6-hour course covering the fundamentals of Python programming, including data types and operators, data structures, control flow, functions, modules and libraries, file handling, error handling, and script execution."
      - ca: "**Python Avançat:** Un curs de 6 hores enfocat en fluxos de treball i llibreries avançades de Python, incloent NumPy, Pandas DataFrames, gràfiques amb Matplotlib i Plotly, i aprenentatge automàtic amb scikit-learn, PyTorch i TensorFlow."
        en: "**Advanced Python:** A 6-hour course focusing on advanced Python workflows and libraries, including NumPy, Pandas DataFrames, plotting with Matplotlib and Plotly, and machine learning with scikit-learn, PyTorch, and TensorFlow."
      - ca: "**Programació de Robots per a Nens:** Un curs introductori de 3 hores perquè els nens explorin la programació utilitzant Mbot i el marc Makeblock."
        en: "**Robot Programming for Kids:** A 3-hour introductory course for children to explore programming using Mbot and the Makeblock framework."
