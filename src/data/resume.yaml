# CV complet: font única dels PDF (cv/cv.typ) i, més endavant, de la Carrera de la web.
#
# Cada text té versió catalana (ca) i anglesa (en). Dates "AAAA-MM" entre cometes;
# end: null vol dir «actualitat». exec: true marca el que entra a la versió
# executive d'una pàgina. **negreta** funciona als punts.
#
# Quan canvies aquest fitxer i fusiones la PR, GitHub Actions genera els PDF,
# els publica a la web i en desa una còpia com a Release del repositori.

