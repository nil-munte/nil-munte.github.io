  headline:
    ca: Arquitecte d'IA · Enginyer de Telecomunicacions · Màster en IA
    en: AI Architect · Telecommunications Engineer · MSc in AI
  summary:
    ca: >-
      Arquitecte d'IA i enginyer de telecomunicacions amb un màster en intel·ligència artificial.
      Dissenyo i desplego solucions d'IA al núvol, MLOps i IA generativa al CTTI (Generalitat de
      Catalunya) i faig classes d'IA, IoT i programació a la Universitat Rovira i Virgili, on he creat
      des de zero l'assignatura d'IA aplicada a les telecomunicacions. Vinc de la recerca en radar
      d'ones mil·limètriques i de la validació de sistemes ADAS, on vaig ser cap de projecte de dos
      projectes europeus de mobilitat autònoma. M'interessen la mobilitat elèctrica i els projectes locals.
    en: >-
      AI architect and telecommunications engineer with an MSc in artificial intelligence. I design
      and deploy cloud AI, MLOps and generative AI solutions at CTTI (Government of Catalonia) and
      teach AI, IoT and programming at Universitat Rovira i Virgili, where I created the course on AI
      for telecommunications from scratch. My background is in millimetre-wave radar research and ADAS
      validation, where I was project manager for two European autonomous-mobility projects.
      I'm keen on electric mobility and local projects.

